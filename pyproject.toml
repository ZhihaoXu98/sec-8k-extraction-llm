[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sec8k"
version = "0.1.0"
description = "Specialized 7B LLM for SEC 8-K extraction (LoRA SFT + DPO; vLLM + AWQ INT4 serving)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "ZhihaoXu98" }]
keywords = ["sec", "edgar", "8-k", "llm", "qwen", "lora", "dpo", "vllm", "awq"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
]
data = [
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]
train = [
    "torch>=2.3",
    "transformers>=4.43",
    "peft>=0.11",
    "trl>=0.9",
    "accelerate>=0.31",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
]
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "langfuse>=2.40",
    "vllm>=0.6",
    "xgrammar>=0.1",
]
quant = [
    "autoawq>=0.2",
]
ui = [
    "streamlit>=1.36",
]

[project.urls]
Repository = "https://github.com/ZhihaoXu98/sec-8k-extraction-llm"

[tool.hatch.build.targets.wheel]
packages = ["src/sec8k"]

[tool.hatch.build.targets.sdist]
include = ["src/sec8k", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sec8k"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "gpu: tests that require a CUDA GPU",
    "slow: tests that take more than ~1 second",
]
